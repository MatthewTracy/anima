services:
  minecraft:
    image: itzg/minecraft-server:latest
    environment:
      EULA: "TRUE"
      VERSION: "1.21.1"
      TYPE: "PAPER"
      MEMORY: "2G"
      ONLINE_MODE: "FALSE"   # required for offline auth used by Mindcraft
      MODE: "survival"
      DIFFICULTY: "hard"     # #4: hard difficulty stress-tests combat fixes
      OPS: ""
      ALLOW_FLIGHT: "TRUE"
      MAX_PLAYERS: "20"
      SPAWN_PROTECTION: "0"
      VIEW_DISTANCE: "10"    # bumped from 8 for better camera footage
      SIMULATION_DISTANCE: "8"
      SERVER_PORT: "25565"
      # B2: Disable connection throttle (default 4000ms blocks rapid bot joins)
      CFG_CONNECTION_THROTTLE: "-1"
      NETWORK_COMPRESSION_THRESHOLD: "256"
      ENABLE_STATUS: "TRUE"
      ENABLE_QUERY: "FALSE"
      ENFORCE_SECURE_PROFILE: "FALSE"
      PREVENT_PROXY_CONNECTIONS: "FALSE"
      PLAYER_IDLE_TIMEOUT: "0"
      # #15: Whitelist — allows only the 10 faction agent names + an Operator slot.
      # Prevents random Minecraft accounts from joining your localhost server.
      ENABLE_WHITELIST: "TRUE"
      WHITELIST: "Madison,Hamilton,Paine,Marshall,Franklin,Chaos,Wolf,Fox,Bear,Raven,Observer,Operator"
      # #16: Restrict mob spawn for cleaner experimental setup
      SPAWN_MONSTERS: "TRUE"
      SPAWN_ANIMALS: "TRUE"
      SPAWN_NPCS: "FALSE"
    ports:
      - "25565:25565"   # default Minecraft port
    volumes:
      - D:/minecraft-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc-monitor", "status", "--host", "localhost", "--port", "25565"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  mindcraft:
    build: .
    environment:
      SETTINGS_JSON: |
        {"auto_open_ui": false, "host": "host.docker.internal"}
    volumes:
      - ./settings.js:/app/settings.js
      - ./keys.json:/app/keys.json
      - ./profiles:/app/profiles
      - ./bots:/app/bots
    ports:
      - "3000-3009:3000-3009"
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      minecraft:
        condition: service_healthy
    profiles:
      - full-docker   # only start with: docker compose --profile full-docker up -d

  viaproxy:
    image: ghcr.io/viaversion/viaproxy:latest
    volumes:
      - ./services/viaproxy:/app/run
    ports:
      - "25568:25568"
    profiles:
      - viaproxy
    stdin_open: true
    tty: true
