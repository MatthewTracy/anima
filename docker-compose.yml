services:
  minecraft:
    image: itzg/minecraft-server:latest
    environment:
      EULA: "TRUE"
      VERSION: "1.21.1"
      TYPE: "PAPER"
      MEMORY: "2G"
      ONLINE_MODE: "FALSE"   # required for offline auth used by Mindcraft
      MODE: "survival"
      DIFFICULTY: "hard"     # #4: hard difficulty stress-tests combat fixes
      # N3: Fixed world seed for reproducibility. Same seed = same map every game.
      # Set to empty string for randomized worlds.
      LEVEL_SEED: "12345"
      # B1 (CRITICAL): without op, /setblock /effect /say /tp all silently fail.
      # Territory markers, spawn protection, governance nudges, faction spawn TPs
      # all needed this. Op all faction members + observer + manual operator slot.
      OPS: "Madison,Hamilton,Paine,Marshall,Franklin,Chaos,Wolf,Fox,Bear,Raven,Observer,Operator,madison,hamilton,paine,marshall,franklin,chaos,wolf,fox,bear,raven,observer,operator"
      ALLOW_FLIGHT: "TRUE"
      MAX_PLAYERS: "20"
      SPAWN_PROTECTION: "0"
      VIEW_DISTANCE: "10"    # bumped from 8 for better camera footage
      SIMULATION_DISTANCE: "8"
      SERVER_PORT: "25565"
      # B2: Disable connection throttle (default 4000ms blocks rapid bot joins)
      CFG_CONNECTION_THROTTLE: "-1"
      NETWORK_COMPRESSION_THRESHOLD: "256"
      ENABLE_STATUS: "TRUE"
      ENABLE_QUERY: "FALSE"
      ENFORCE_SECURE_PROFILE: "FALSE"
      PREVENT_PROXY_CONNECTIONS: "FALSE"
      PLAYER_IDLE_TIMEOUT: "0"
      # Whitelist: keeps random Minecraft accounts off your localhost server.
      # Both case variants since mineflayer might use either.
      ENABLE_WHITELIST: "TRUE"
      WHITELIST: "Madison,Hamilton,Paine,Marshall,Franklin,Chaos,Wolf,Fox,Bear,Raven,Observer,Operator,madison,hamilton,paine,marshall,franklin,chaos,wolf,fox,bear,raven,observer,operator"
      ENFORCE_WHITELIST: "TRUE"   # actually enforce — both case variants are listed above
      # #16: Restrict mob spawn for cleaner experimental setup
      SPAWN_MONSTERS: "TRUE"
      SPAWN_ANIMALS: "TRUE"
      SPAWN_NPCS: "FALSE"
    ports:
      - "25565:25565"   # default Minecraft port
    volumes:
      # Cross-platform: named volume managed by Docker (works on Windows/Mac/Linux).
      # Override via MINECRAFT_DATA_DIR env var if you want a host bind mount.
      - ${MINECRAFT_DATA_DIR:-minecraft-data}:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc-monitor", "status", "--host", "localhost", "--port", "25565"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  mindcraft:
    build: .
    environment:
      SETTINGS_JSON: |
        {"auto_open_ui": false, "host": "host.docker.internal"}
    volumes:
      - ./settings.js:/app/settings.js
      - ./keys.json:/app/keys.json
      - ./profiles:/app/profiles
      - ./bots:/app/bots
    ports:
      - "3000-3009:3000-3009"
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      minecraft:
        condition: service_healthy
    profiles:
      - full-docker   # only start with: docker compose --profile full-docker up -d

  viaproxy:
    image: ghcr.io/viaversion/viaproxy:latest
    volumes:
      - ./services/viaproxy:/app/run
    ports:
      - "25568:25568"
    profiles:
      - viaproxy
    stdin_open: true
    tty: true

volumes:
  minecraft-data:
    # Default named volume. Override with MINECRAFT_DATA_DIR=/path to use a bind mount.
