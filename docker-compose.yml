services:
  minecraft:
    image: itzg/minecraft-server:latest
    environment:
      EULA: "TRUE"
      VERSION: "1.21.1"
      # G4: switched to VANILLA — Paper's anti-cheat ("flying", "moved too quickly")
      # was kicking mineflayer bots even with spigot.yml patched. Vanilla doesn't
      # ship those checks at all. Slightly slower but bots actually stay connected.
      TYPE: "VANILLA"
      MEMORY: "2G"
      ONLINE_MODE: "FALSE"   # required for offline auth used by Mindcraft
      MODE: "survival"
      DIFFICULTY: "hard"     # #4: hard difficulty stress-tests combat fixes
      # N3: Fixed world seed for reproducibility. Same seed = same map every game.
      # Set to empty string for randomized worlds.
      # v1.1.72: was LEVEL_SEED — itzg/minecraft-server reads `SEED`, not
      # `LEVEL_SEED`. Pre-fix, the env var was silently ignored: every
      # regenerated world was random and the "fixed seed" claim was a lie.
      # Verified by checking /data/server.properties — `level-seed=` was empty.
      SEED: "12345"
      # B1 (CRITICAL): without op, /setblock /effect /say /tp all silently fail.
      # Territory markers, spawn protection, governance nudges, faction spawn TPs
      # all needed this. Op all faction members + observer + manual operator slot.
      OPS: "Madison,Hamilton,Paine,Marshall,Franklin,Chaos,Wolf,Fox,Bear,Raven,Observer,Operator,madison,hamilton,paine,marshall,franklin,chaos,wolf,fox,bear,raven,observer,operator"
      ALLOW_FLIGHT: "TRUE"
      MAX_PLAYERS: "20"
      SPAWN_PROTECTION: "0"
      # Note: Paper's "moved too quickly" anti-cheat must be loosened in
      # spigot.yml AFTER the world generates. Run this once per world:
      #   docker exec anima-minecraft-1 sh -c \
      #     "sed -i 's/moved-too-quickly-multiplier:.*/moved-too-quickly-multiplier: 10000.0/' /data/spigot.yml"
      #   docker restart anima-minecraft-1
      VIEW_DISTANCE: "10"    # bumped from 8 for better camera footage
      SIMULATION_DISTANCE: "8"
      SERVER_PORT: "25565"
      # B2: Disable connection throttle (default 4000ms blocks rapid bot joins)
      CFG_CONNECTION_THROTTLE: "-1"
      NETWORK_COMPRESSION_THRESHOLD: "256"
      ENABLE_STATUS: "TRUE"
      ENABLE_QUERY: "FALSE"
      ENFORCE_SECURE_PROFILE: "FALSE"
      PREVENT_PROXY_CONNECTIONS: "FALSE"
      PLAYER_IDLE_TIMEOUT: "0"
      # Whitelist disabled — localhost-only server with offline auth has UUID
      # mismatch issues between Paper's whitelist generator and mineflayer's
      # offline UUIDs. Since this only listens on 127.0.0.1, the security risk
      # is zero anyway.
      ENABLE_WHITELIST: "FALSE"
      ENFORCE_WHITELIST: "FALSE"
      # #16: Restrict mob spawn for cleaner experimental setup
      SPAWN_MONSTERS: "TRUE"
      SPAWN_ANIMALS: "TRUE"
      SPAWN_NPCS: "FALSE"
    ports:
      - "25565:25565"   # default Minecraft port
    volumes:
      # Cross-platform: named volume managed by Docker (works on Windows/Mac/Linux).
      # Override via MINECRAFT_DATA_DIR env var if you want a host bind mount.
      - ${MINECRAFT_DATA_DIR:-minecraft-data}:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc-monitor", "status", "--host", "localhost", "--port", "25565"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 120s

  mindcraft:
    build: .
    environment:
      SETTINGS_JSON: |
        {"auto_open_ui": false, "host": "host.docker.internal"}
    volumes:
      - ./settings.js:/app/settings.js
      - ./keys.json:/app/keys.json
      - ./profiles:/app/profiles
      - ./bots:/app/bots
    ports:
      - "3000-3009:3000-3009"
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      minecraft:
        condition: service_healthy
    profiles:
      - full-docker   # only start with: docker compose --profile full-docker up -d

  viaproxy:
    image: ghcr.io/viaversion/viaproxy:latest
    volumes:
      - ./services/viaproxy:/app/run
    ports:
      - "25568:25568"
    profiles:
      - viaproxy
    stdin_open: true
    tty: true

volumes:
  minecraft-data:
    # Default named volume. Override with MINECRAFT_DATA_DIR=/path to use a bind mount.
