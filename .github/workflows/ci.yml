name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  syntax-check:
    name: Syntax check core + scenarios + scripts
    runs-on: ubuntu-latest
    # v1.1.61: hard cap. Syntax-check runs in ~10s; 5 min is generous.
    # Without an explicit cap a hung step runs to GitHub's 6h ceiling.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # No npm install — syntax-check doesn't need dependencies. The
      # full Forum scenario depends on mineflayer + canvas, which require
      # native build tools. Core / Cloister / Outpost / Crew are
      # dependency-free for parsing.
      - name: node --check core/
        run: |
          for f in $(find core -name '*.js'); do
            node --check "$f"
          done
      - name: node --check scripts/
        run: |
          for f in $(find scripts -name '*.js'); do
            node --check "$f"
          done
      - name: node --check scenarios/cloister + outpost + crew + cell
        run: |
          for f in $(find scenarios/cloister scenarios/outpost scenarios/crew scenarios/cell -name '*.js'); do
            node --check "$f"
          done
      - name: Validate scenario JSONs
        run: |
          for f in $(find scenarios -name '*.json'); do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"
          done
      - name: Validate burden bank JSONs
        run: |
          for f in $(find core/burdens/banks -name '*.json'); do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"
          done

  test:
    name: Unit tests for core/ (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # v1.1.61: hard cap. The full suite runs in ~3s (Linux) / under a
    # minute (Windows). 10 min absorbs npm-install variance while making
    # a hung test fail in minutes instead of burning GitHub's 6h ceiling
    # — which is what v1.1.56–v1.1.59 did (the un-unref'd governance tick
    # interval; fixed in v1.1.60) at ~48 runner-hours total. That spend
    # is the likely trigger for the Actions billing block.
    timeout-minutes: 10
    strategy:
      # Both OSes to catch Windows-specific regressions (e.g. v1.1.22's
      # atomicWriteFileSync rename retry on EPERM/EACCES, which only
      # surfaces on Windows under AV/indexer contention).
      matrix:
        os: [ubuntu-latest, windows-latest]
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Run core tests
        run: npm test
